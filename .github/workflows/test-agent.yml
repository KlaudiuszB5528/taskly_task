name: Test agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "$BASE_REF"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci

      - name: Analyze the pull request and update tests
        working-directory: agent
        env:
          TEST_AGENT_API_KEY: ${{ secrets.TEST_AGENT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TEST_AGENT_BASE_URL: ${{ vars.TEST_AGENT_BASE_URL }}
          TEST_AGENT_MODEL: ${{ vars.TEST_AGENT_MODEL }}
          TEST_AGENT_PUSH_TOKEN: ${{ secrets.TEST_AGENT_PUSH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m test_agent run --base "$BASE_SHA" --head "$HEAD_SHA" --commit --push
